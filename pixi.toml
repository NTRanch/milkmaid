# Milkmaid kernel — toolchain pin of record (engine-research chapter).
# Mojo is an authoring-time reference only; nothing Mojo-built ships.
# The pin matters because the stdlib still changes between releases:
# an unpinned kernel is a future conformance failure. The golden
# vectors in conformance/vectors.json are the durable contract.
#
# STATUS 2026-10-30: pin recorded; toolchain NOT installed on the build
# host tonight (see docs/BREAKAGE-LOG.md B-1 and book/src/build.md).
# Until `pixi run mojo run src/kernel.mojo` runs on a host with the
# toolchain, tools/gen-vectors.mjs (a line transcription of the kernel)
# is the driver that emits the vectors, and this file is the pin the
# regeneration will be checked against.

[workspace]
name = "milkmaid-kernel"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
mojo = "==0.25.6.1"

[tasks]
tables = "mojo run src/kernel.mojo"
